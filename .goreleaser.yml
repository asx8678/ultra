# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ultra

before:
  hooks:
    - go mod download
    - rm -rf completions manpages
    - mkdir -p completions manpages
    - sh -c 'go run . completion bash >./completions/ultra.bash'
    - sh -c 'go run . completion zsh >./completions/ultra.zsh'
    - sh -c 'go run . completion fish >./completions/ultra.fish'
    - sh -c 'go run . man | gzip -c >./manpages/ultra.1.gz'

builds:
  - env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X github.com/asx8678/ultra/internal/version.Version={{.Version}}
    flags:
      - -trimpath

archives:
  - name_template: >-
      ultra_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm}}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^(build|ci|docs|test)(\\(.+\\))?:"
      - "^chore(\\(deps\\))?:"
      - "^v\\d"
      - "^Merge "

# Modular signing (cosign). Enabled per-release by exporting the signing
# secret that Keyless signatures are storage-backend driven:
#
#   COSIGN_PASSWORD and the tuf/rekor endpoints are read from the environment.
#   Both blobs and the checksum file are signed when the env secret is present.
#   Disabled otherwise (no signatures produced) so local/CI dry runs stay
#   side-effect free.
#
# Uncomment and define the secret-driven steps below to enable signing:
#
#  signs:
#    - cmd: cosign
#      env:
#        - SIGNING_SECRET=${COSIGN_PRIVATE_KEY}   # injected by the release CI
#      args:
#        - sign-blob
#        - --key=env://SIGNING_SECRET
#        - --output-signature=${signature}
#        - ${artifact}
#      artifacts: all
#      output: true
#
#  docker_signs:
#    - cmd: cosign
#      artifacts: all
#      output: true
#      args:
#        - sign
#        - --key=env://SIGNING_SECRET
#        - ${artifact}
#
# Provenance (SLSA level 3) placeholder. Activate by uploading the
# generated spdx/sbom and the cosign certificates+signatures to the
# attestation registry used by your release pipeline:
#
#  provenance:
#    enabled: true
#    strict: true
#    uploads:
#      - to: image
#
release:
  prerelease: auto
